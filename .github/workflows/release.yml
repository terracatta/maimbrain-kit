# Builds mb for each platform when a v* tag is pushed and attaches the
# archives to the GitHub release (maimbrain.com/install.sh downloads them).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }  # cross-compiled; GitHub is retiring Intel runners
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build -p mb-cli --release --target ${{ matrix.target }}
      - run: tar -czf mb-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release mb
      - uses: softprops/action-gh-release@v2
        with:
          files: mb-${{ matrix.target }}.tar.gz
