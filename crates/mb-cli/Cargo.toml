[package]
name = "mb-cli"
description = "The `mb` command: build, pack and validate Maimbrain games"
edition.workspace = true
version = "0.4.0"
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
mb-format = { version = "0.0.0", path = "../mb-format" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12"
toml = "1.1.6"
ureq = { version = "3", features = ["json"] }

[[bin]]
name = "mb"
path = "src/main.rs"
