[package]
name = "mb-cli"
description = "The `mb` command: build, pack and validate Maimbrain games"
edition.workspace = true
version = "0.6.0"
publish.workspace = true

[dependencies]
base64 = "0.23"
clap = { version = "4.6.7", features = ["derive"] }
mb-format = { version = "0.0.0", path = "../mb-format" }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha1_smol = "1"
sha2 = "0.11"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "wav", "pcm", "ogg", "vorbis"] }
tiny_http = "0.12"
toml = "1.1.6"
# Font outlines, metrics, kerning and variations for `mb font add`.
ttf-parser = "0.25"
ureq = { version = "3", features = ["json"] }
zune-jpeg = "0.5.15"

[[bin]]
name = "mb"
path = "src/main.rs"
