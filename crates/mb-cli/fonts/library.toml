# Maimbrain font library: OFL/Apache fonts from github.com/google/fonts, pinned to one commit.
# `mb font add <game> <id>` downloads a font from `base` + path, checks its sha256, and bakes it.
# Sorted by category, then id. Licenses were fetched and checked at this commit (SIL OFL 1.1 or Apache 2.0).
[source]
repo = "https://github.com/google/fonts"
commit = "5e8a3ba899557829a76cfdac30fa512bda91d7ca"
base = "https://raw.githubusercontent.com/google/fonts/5e8a3ba899557829a76cfdac30fa512bda91d7ca/"

